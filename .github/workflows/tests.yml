name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"  # the CV test renders HTML only; no Chrome needed
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: astral-sh/setup-uv@v5

      - run: bun install --frozen-lockfile

      - name: Script tests (pytest)
        run: uvx pytest

      - name: Site, CV and theme tests (bun, accent theme)
        run: bun test tests/

      # Both build-time themes must pass the SEO and CV checks (issue #33)
      - name: Site and CV tests (bun, editorial theme)
        run: bun test tests/seo.test.js tests/cv-to-pdf.test.js
        env:
          SITE_THEME: editorial
