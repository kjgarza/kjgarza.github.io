<!doctype html><html><head><meta charset="utf-8"><title>popover probe</title>
<style>
#mobile-menu { position: fixed; inset: auto 12px auto 12px; top: 64px; margin: 0; border: 0; padding: 0; background: transparent; }
#mobile-menu:popover-open { display: block; }
#burger-btn[aria-expanded=true] .i-menu, #burger-btn:not([aria-expanded=true]) .i-x { display: none; }
</style></head><body>
<nav><button id="burger-btn" popovertarget="mobile-menu" aria-label="Toggle menu" aria-expanded="false"><span class="i-menu">☰</span><span class="i-x">✕</span></button></nav>
<div id="mobile-menu" popover><a href="#a">About</a><a href="#b">Work</a></div>
<p id="outside">outside</p>
<script>
  // Only job left for JS: mirror popover state onto aria-expanded and close on link click
  const menu = document.getElementById('mobile-menu'), btn = document.getElementById('burger-btn');
  menu.addEventListener('toggle', e => btn.setAttribute('aria-expanded', e.newState === 'open'));
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => menu.hidePopover()));
</script></body></html>
