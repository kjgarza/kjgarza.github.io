# Deploy: cd worker/ask && bunx wrangler deploy
# Secrets, depending on ASK_ENGINE:
#   claude: bunx wrangler secret put ANTHROPIC_API_KEY  (set a monthly spend limit on its Anthropic workspace)
#   jev:    bunx wrangler secret put AI_GATEWAY_API_KEY (set a budget on the Vercel AI Gateway team)
name = "kjgarza-ask"
main = "index.mjs"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://kjgarza.github.io/"
ALLOWED_ORIGINS = "https://kjgarza.github.io"
ASK_ENGINE = "claude"
ASK_MODEL = "claude-haiku-5-5"
JEV_MODEL = "typesafe-ai/jev"
RATE_LIMIT_PER_HOUR = "10"
